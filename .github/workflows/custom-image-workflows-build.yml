name: Custom Image Workflows - Android Build

on:
  push:
    branches:
      - feature/custom-image-workflows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-image-workflows-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Kotlin
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin -x ':app:configureCMakeRelease[arm64-v8a]' --stacktrace

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PocketTavern-custom-image-workflows-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
